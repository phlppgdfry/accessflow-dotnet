name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AccessFlow.slnx
      - name: Verify formatting
        run: dotnet format AccessFlow.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build AccessFlow.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test AccessFlow.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
