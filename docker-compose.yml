services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: accessflow
      POSTGRES_USER: accessflow
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessflow -d accessflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - accessflow-postgres:/var/lib/postgresql/data

volumes:
  accessflow-postgres:
